<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CINESOCIETY | Theater Node</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --cine-red: #e50914; --cine-neon: #00f8ff; --bg-dark: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: #fff; font-family: 'Montserrat', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* Secure Overlay Intro */
        #secure-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s; }
        .lock-icon { font-size: 3rem; color: var(--cine-neon); margin-bottom: 20px; animation: pulse 1s infinite alternate; }
        .sec-text { font-family: 'Share Tech Mono'; color: #00ff88; font-size: 1.2rem; letter-spacing: 4px; }

        /* Header / App Bar */
        .player-header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, rgba(0,0,0,0.9), transparent); z-index: 100; transition: opacity 0.5s; }
        .back-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); transition: 0.3s; }
        .back-btn:hover { background: var(--cine-red); border-color: var(--cine-red); }
        .movie-title { font-weight: 700; font-size: 1.1rem; text-shadow: 0 2px 10px #000; }
        .server-ping { font-family: 'Share Tech Mono'; font-size: 0.8rem; color: var(--cine-neon); background: rgba(0,248,255,0.1); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--cine-neon); }

        /* The Player Container */
        .video-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Custom Controls Layer */
        .custom-controls { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%); padding: 40px 20px 20px; display: flex; flex-direction: column; gap: 15px; opacity: 1; transition: opacity 0.5s; }
        
        .progress-area { display: flex; align-items: center; gap: 15px; font-family: 'Share Tech Mono'; font-size: 0.85rem; }
        .timeline-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; position: relative; }
        .timeline-fill { height: 100%; width: 35%; background: var(--cine-red); border-radius: 5px; position: relative; box-shadow: 0 0 10px var(--cine-red); }
        .timeline-fill::after { content: ''; position: absolute; right: -6px; top: -4px; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        .action-row { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-group { display: flex; align-items: center; gap: 20px; }
        .ctrl-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .ctrl-btn:hover { color: var(--cine-neon); transform: scale(1.1); }
        
        .quality-badge { background: transparent; border: 1px solid #fff; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .quality-badge:hover { background: #fff; color: #000; }

        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 20px var(--cine-neon); border-radius: 50%; } }

        /* Hide controls when inactive */
        .video-container.inactive .player-header, .video-container.inactive .custom-controls { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="secure-overlay">
        <i class="fas fa-shield-alt lock-icon"></i>
        <div class="sec-text">ESTABLISHING SECURE STREAM</div>
        <div style="font-size:0.7rem; color:#666; margin-top:10px;">Routing via Hugging Face Clusters...</div>
    </div>

    <div class="video-container" id="playerWrapper">
        
        <div class="player-header">
            <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
            <div class="movie-title">CINESOCIETY PREMIERE</div>
            <div class="server-ping"><i class="fas fa-signal"></i> 24ms</div>
        </div>

        <video id="cinePlayer" poster="https://via.placeholder.com/1280x720/111/333?text=Loading+Media...">
            <source src="#" type="video/mp4">
        </video>

        <div class="custom-controls">
            <div class="progress-area">
                <span id="currTime">01:24:10</span>
                <div class="timeline-bg">
                    <div class="timeline-fill"></div>
                </div>
                <span id="totTime">02:15:00</span>
            </div>
            
            <div class="action-row">
                <div class="ctrl-group">
                    <button class="ctrl-btn"><i class="fas fa-play"></i></button>
                    <button class="ctrl-btn"><i class="fas fa-backward"></i></button>
                    <button class="ctrl-btn"><i class="fas fa-forward"></i></button>
                    <button class="ctrl-btn" style="font-size: 1.2rem;"><i class="fas fa-volume-up"></i></button>
                </div>
                <div class="ctrl-group">
                    <button class="quality-badge">1080p HQ</button>
                    <button class="ctrl-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Remove Secure Overlay after fake decryption delay
        setTimeout(() => {
            document.getElementById('secure-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('secure-overlay').style.display = 'none', 1000);
        }, 2500);

        // Auto-hide controls logic for pure cinematic experience
        let timeout;
        const wrapper = document.getElementById('playerWrapper');
        
        function resetTimer() {
            wrapper.classList.remove('inactive');
            clearTimeout(timeout);
            timeout = setTimeout(() => wrapper.classList.add('inactive'), 3000);
        }

        wrapper.addEventListener('mousemove', resetTimer);
        wrapper.addEventListener('touchstart', resetTimer);
        resetTimer();

        // Fullscreen API Logic
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (wrapper.requestFullscreen) wrapper.requestFullscreen();
                else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
    </script>
</body>
</html>

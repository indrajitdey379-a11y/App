<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050508">
    <title>CINESOCIETY | Data Transfer Node</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-master: #050508;
            --cine-gold: #f5c518; 
            --cine-red: #e50914; 
            --cine-neon: #00f8ff;
            --glass-bg: rgba(15, 15, 20, 0.7);
            --border-glass: 1px solid rgba(0, 248, 255, 0.2);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-master); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Background Grid Animation */
        .cyber-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-image: linear-gradient(rgba(0, 248, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 248, 255, 0.05) 1px, transparent 1px); background-size: 30px 30px; animation: moveGrid 15s linear infinite; opacity: 0.5; }
        @keyframes moveGrid { 0% { transform: translateY(0); } 100% { transform: translateY(30px); } }

        /* Premium Header */
        .header { padding: 25px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); text-align: center; border-bottom: var(--border-glass); }
        .header h1 { font-family: 'Cinzel', serif; color: var(--cine-neon); font-size: 1.8rem; letter-spacing: 5px; text-shadow: 0 0 15px rgba(0,248,255,0.4); }
        .header-sub { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--cine-gold); letter-spacing: 2px; }

        /* Storage Analyzer Section */
        .storage-box { margin: 15px; padding: 20px; background: var(--glass-bg); border-radius: 15px; border: var(--border-glass); box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .storage-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; color: #aaa; }
        .storage-bar-bg { width: 100%; height: 8px; background: #222; border-radius: 10px; overflow: hidden; }
        .storage-bar-fill { width: 68%; height: 100%; background: linear-gradient(90deg, var(--cine-neon), var(--cine-gold)); box-shadow: 0 0 10px var(--cine-neon); }

        /* Content Area & Tabs */
        .tab-container { display: flex; justify-content: space-around; margin: 10px 15px; border-bottom: 1px solid #333; }
        .tab { padding: 10px 20px; font-weight: 900; color: #666; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 0.85rem; }
        .tab.active { color: var(--cine-red); border-bottom: 3px solid var(--cine-red); text-shadow: 0 0 10px rgba(229, 9, 20, 0.5); }

        .content-area { flex: 1; overflow-y: auto; padding: 0 15px 90px; }
        .content-area::-webkit-scrollbar { width: 4px; }
        .content-area::-webkit-scrollbar-thumb { background: var(--cine-neon); }

        /* Download Item Card */
        .dl-card { background: rgba(0,0,0,0.6); border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; transition: 0.3s; position: relative; overflow: hidden; }
        .dl-card:hover { border-color: var(--cine-neon); box-shadow: 0 5px 15px rgba(0,248,255,0.1); }
        .dl-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background: var(--cine-neon); }
        .dl-card.paused::before { background: var(--cine-gold); }
        .dl-card.completed::before { background: #00ff88; }

        .dl-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .dl-info h3 { font-size: 1rem; color: #fff; margin-bottom: 5px; font-weight: 800; }
        .dl-meta { font-size: 0.7rem; color: #888; font-family: 'Share Tech Mono', monospace; }
        .dl-status-icon { font-size: 1.2rem; color: var(--cine-neon); }

        /* Live Progress Array */
        .progress-wrapper { margin-top: 15px; }
        .p-bar-bg { width: 100%; height: 6px; background: #111; border-radius: 5px; overflow: hidden; position: relative; }
        .p-bar-fill { height: 100%; background: var(--cine-neon); width: 0%; transition: width 0.3s linear; position: relative; }
        .p-bar-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimmer 1s infinite; }
        
        .p-stats { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 8px; color: #aaa; font-family: 'Share Tech Mono', monospace; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(5,5,8,0.95); border-top: var(--border-glass); display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(15px); padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #555; text-decoration: none; font-size: 0.7rem; font-weight: bold; transition: 0.3s; }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--cine-neon); transform: translateY(-3px); text-shadow: 0 0 10px rgba(0,248,255,0.5); }

        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="header">
        <h1>TRANSFER NODE</h1>
        <div class="header-sub">SECURE PROTOCOL • INDRAJIT DEY</div>
    </div>

    <div class="storage-box">
        <div class="storage-header">
            <span>LOCAL STORAGE</span>
            <span style="color: var(--cine-neon);">86 GB / 128 GB</span>
        </div>
        <div class="storage-bar-bg">
            <div class="storage-bar-fill"></div>
        </div>
        <div style="text-align: right; font-size: 0.65rem; color: #666; margin-top: 5px;">SYSTEM HEALTH: OPTIMAL</div>
    </div>

    <div class="tab-container">
        <div class="tab active" onclick="switchTab('active')">ACTIVE (1)</div>
        <div class="tab" onclick="switchTab('completed')">COMPLETED (24)</div>
    </div>

    <div class="content-area" id="dl-list">
        </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item"><i class="fas fa-bars"></i><span>MENU</span></a>
        <a href="main-grid.html" class="nav-item"><i class="fas fa-home"></i><span>HOME</span></a>
        <a href="downloads.html" class="nav-item active"><i class="fas fa-download"></i><span>DOWNLOADS</span></a>
    </div>

    <script>
        // Advanced Simulation of Download Engine
        let progress = 42.5;
        
        function renderActive() {
            document.getElementById('dl-list').innerHTML = `
                <div class="dl-card">
                    <div class="dl-top">
                        <div class="dl-info">
                            <h3>Housefull 5 (2025)</h3>
                            <div class="dl-meta">1080p WEB-DL • 2.4 GB</div>
                        </div>
                        <i class="fas fa-sync fa-spin dl-status-icon"></i>
                    </div>
                    <div class="progress-wrapper">
                        <div class="p-bar-bg"><div class="p-bar-fill" id="live-bar"></div></div>
                        <div class="p-stats">
                            <span id="live-speed" style="color: #00f8ff;">5.4 MB/s</span>
                            <span id="live-percent">42.5%</span>
                        </div>
                    </div>
                </div>
            `;
            startSimulation();
        }

        function renderCompleted() {
            document.getElementById('dl-list').innerHTML = `
                <div class="dl-card completed">
                    <div class="dl-top">
                        <div class="dl-info">
                            <h3>Inception (2010)</h3>
                            <div class="dl-meta">4K UHD BluRay • 14.2 GB</div>
                        </div>
                        <i class="fas fa-check-circle" style="color: #00ff88; font-size:1.5rem;"></i>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button style="flex:1; padding:10px; background:#111; color:#fff; border:1px solid #333; border-radius:5px; font-weight:bold;">PLAY FILE</button>
                        <button style="flex:1; padding:10px; background:var(--cine-red); color:#fff; border:none; border-radius:5px; font-weight:bold;" onclick="alert('Moved to Public Storage!')">SAVE TO SD</button>
                    </div>
                </div>
            `;
        }

        let simInterval;
        function startSimulation() {
            clearInterval(simInterval);
            simInterval = setInterval(() => {
                let bar = document.getElementById('live-bar');
                let pct = document.getElementById('live-percent');
                let spd = document.getElementById('live-speed');
                if(!bar) return;
                
                progress += (Math.random() * 0.5);
                if(progress > 100) progress = 100;
                
                bar.style.width = progress + '%';
                pct.innerText = progress.toFixed(1) + '%';
                spd.innerText = (Math.random() * (6.5 - 4.0) + 4.0).toFixed(1) + ' MB/s';
                
            }, 1000);
        }

        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if(type === 'active') renderActive();
            else renderCompleted();
        }

        // Init
        renderActive();
    </script>
</body>
</html>

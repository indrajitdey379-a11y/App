name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize Project & Install Capacitor
        run: |
          mkdir www
          cp -r * www/ || true
          rm -rf www/www www/.git www/.github
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest
          npx cap init "My Movie App" "com.indra.movieapp" --web-dir www

      - name: Add Android Platform
        run: |
          npm install @capacitor/android@latest
          npx cap add android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: indra-movie-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
